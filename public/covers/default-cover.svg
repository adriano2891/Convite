<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1880" width="840" height="1880">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;display=swap');
      text {
        font-family: 'Montserrat', 'Liberation Sans', 'Nimbus Sans', Arial, sans-serif;
      }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2F9F8" />
      <stop offset="15%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F8F7" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007F73" />
      <stop offset="100%" stop-color="#005B52" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#003833" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="1880" fill="url(#bgGrad)" />

  <!-- Top-left geometric ribbon accents -->
  <polygon points="0,0 220,0 0,220" fill="#003D38" />
  <polygon points="0,0 150,0 0,150" fill="#005952" />
  <polygon points="0,0 70,0 0,70" fill="#008075" />

  <!-- Top-right geometric ribbon accents -->
  <polygon points="620,0 840,0 840,220" fill="#003D38" />
  <polygon points="690,0 840,0 840,150" fill="#005952" />
  <polygon points="770,0 840,0 840,70" fill="#008075" />

  <!-- LOGOS HEADER -->
  <g id="header-logos" transform="translate(130, 70)">
    <!-- Grupo Ativa Logo (Left) -->
    <g transform="translate(0, 0)">
      <!-- Ativa Emblem -->
      <g transform="translate(20, 15)">
        <ellipse cx="65" cy="35" rx="55" ry="28" fill="#002D3A" transform="rotate(-15 65 35)" />
        <ellipse cx="65" cy="35" rx="42" ry="18" fill="#FFFFFF" transform="rotate(-15 65 35)" />
        <circle cx="65" cy="35" r="14" fill="#00A896" />
        <path d="M60 43 L65 26 L70 43 Z M62 38 L68 38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
      </g>
      <!-- Ativa Text -->
      <text x="175" y="42" font-size="22" font-weight="700" fill="#002D3A" letter-spacing="2">GRUPO</text>
      <text x="175" y="74" font-size="34" font-weight="900" fill="#007F73" letter-spacing="1">ATIVA</text>
    </g>

    <!-- Intelbras Logo (Right) -->
    <g transform="translate(360, 20)">
      <text x="30" y="46" font-size="44" font-weight="800" fill="#009540" letter-spacing="-0.5">intelbras</text>
      <text x="110" y="68" font-size="14" font-weight="600" fill="#009540" letter-spacing="0.5">sempre próxima</text>
    </g>
  </g>

  <!-- CONVITE ESPECIAL HEADER -->
  <g transform="translate(0, 220)">
    <line x1="70" y1="0" x2="280" y2="0" stroke="#004D40" stroke-width="1.8" />
    <text x="420" y="6" font-size="19" font-weight="700" fill="#004D40" text-anchor="middle" letter-spacing="5">CONVITE ESPECIAL</text>
    <line x1="560" y1="0" x2="770" y2="0" stroke="#004D40" stroke-width="1.8" />
  </g>

  <!-- SÍNDICOS & ZELADORES BADGE -->
  <g transform="translate(90, 260)">
    <rect x="0" y="0" width="660" height="90" rx="45" fill="#FFFFFF" stroke="#003D38" stroke-width="2" />
    
    <!-- Icons of Síndico & Zelador inside pill -->
    <g transform="translate(35, 16)">
      <!-- Sindico figure -->
      <circle cx="25" cy="18" r="10" fill="none" stroke="#007F73" stroke-width="2.5" />
      <path d="M12 48 C12 36 38 36 38 48" fill="none" stroke="#007F73" stroke-width="2.5" />
      <path d="M25 35 L27 45 L25 48 L23 45 Z" fill="#007F73" />
      <!-- Zelador figure -->
      <circle cx="60" cy="20" r="9" fill="none" stroke="#007F73" stroke-width="2.5" />
      <path d="M47 16 Q60 10 73 16 L76 19 L44 19 Z" fill="#007F73" />
      <path d="M48 48 C48 38 72 38 72 48" fill="none" stroke="#007F73" stroke-width="2.5" />
      <line x1="60" y1="36" x2="60" y2="48" stroke="#007F73" stroke-width="2" />
    </g>

    <text x="145" y="58" font-size="27" font-weight="800" fill="#0A2540" letter-spacing="3">SÍNDICOS &amp; ZELADORES</text>
  </g>

  <!-- MAIN HEADLINE -->
  <g transform="translate(420, 445)">
    <text x="0" y="0" font-size="64" font-weight="900" fill="#0A2540" text-anchor="middle" letter-spacing="1">TREINAMENTO</text>
    <text x="0" y="95" font-size="82" font-weight="900" fill="#007F73" text-anchor="middle" letter-spacing="2">INTELBRAS</text>

    <!-- 3 Connected People Icon -->
    <g transform="translate(-45, 125)">
      <circle cx="15" cy="15" r="7" fill="none" stroke="#00897B" stroke-width="2.5" />
      <circle cx="45" cy="12" r="8" fill="none" stroke="#00897B" stroke-width="2.5" />
      <circle cx="75" cy="15" r="7" fill="none" stroke="#00897B" stroke-width="2.5" />
      <path d="M3 32 C3 25 27 25 27 32" fill="none" stroke="#00897B" stroke-width="2.2" />
      <path d="M30 32 C30 23 60 23 60 32" fill="none" stroke="#00897B" stroke-width="2.5" />
      <path d="M63 32 C63 25 87 25 87 32" fill="none" stroke="#00897B" stroke-width="2.2" />
      <line x1="22" y1="15" x2="37" y2="12" stroke="#00897B" stroke-width="1.8" />
      <line x1="53" y1="12" x2="68" y2="15" stroke="#00897B" stroke-width="1.8" />
    </g>

    <line x1="-310" y1="145" x2="-65" y2="145" stroke="#004D40" stroke-width="1.2" />
    <line x1="65" y1="145" x2="310" y2="145" stroke="#004D40" stroke-width="1.2" />
  </g>

  <!-- SUBTITLE -->
  <g transform="translate(420, 640)" text-anchor="middle">
    <text x="0" y="0" font-size="22" font-weight="500" fill="#334E68">Um momento de <tspan font-weight="700" fill="#007F73">conhecimento, inovação e</tspan></text>
    <text x="0" y="32" font-size="22" font-weight="700" fill="#007F73">tecnologia <tspan font-weight="500" fill="#334E68">para impulsionar</tspan></text>
    <text x="0" y="64" font-size="22" font-weight="500" fill="#334E68">ainda mais os nossos resultados.</text>
  </g>

  <!-- EVENT DETAILS 3-COLUMN CARD -->
  <g transform="translate(50, 765)">
    <!-- White Card with subtle border -->
    <rect x="0" y="0" width="740" height="230" rx="24" fill="#FFFFFF" stroke="#D1EAE7" stroke-width="1.5" filter="url(#cardShadow)" />

    <!-- Column Dividers -->
    <line x1="255" y1="25" x2="255" y2="205" stroke="#E2E8F0" stroke-width="1.5" />
    <line x1="495" y1="25" x2="495" y2="205" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- COLUMN 1: DATA -->
    <g transform="translate(125, 45)" text-anchor="middle">
      <!-- Calendar Icon -->
      <g transform="translate(-25, 0)">
        <rect x="0" y="8" width="50" height="42" rx="8" fill="none" stroke="#007F73" stroke-width="3" />
        <line x1="12" y1="0" x2="12" y2="12" stroke="#007F73" stroke-width="3.5" stroke-linecap="round" />
        <line x1="38" y1="0" x2="38" y2="12" stroke="#007F73" stroke-width="3.5" stroke-linecap="round" />
        <line x1="0" y1="22" x2="50" y2="22" stroke="#007F73" stroke-width="2" />
        <circle cx="16" cy="33" r="3" fill="#007F73" />
        <circle cx="26" cy="33" r="3" fill="#007F73" />
        <circle cx="36" cy="33" r="3" fill="#007F73" />
      </g>
      <text x="0" y="82" font-size="15" font-weight="700" fill="#627D98" letter-spacing="1.5">DATA</text>
      <text x="0" y="128" font-size="44" font-weight="900" fill="#004D40">21/09</text>
      <text x="0" y="156" font-size="16" font-weight="800" fill="#627D98" letter-spacing="1">SEGUNDA</text>
    </g>

    <!-- COLUMN 2: HORÁRIO -->
    <g transform="translate(375, 45)" text-anchor="middle">
      <!-- Clock Icon -->
      <circle cx="0" cy="28" r="26" fill="none" stroke="#007F73" stroke-width="3" />
      <polyline points="0,12 0,28 14,28" fill="none" stroke="#007F73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="0" y="82" font-size="15" font-weight="700" fill="#627D98" letter-spacing="1.5">HORÁRIO</text>
      <text x="0" y="128" font-size="44" font-weight="900" fill="#004D40">14h</text>
    </g>

    <!-- COLUMN 3: COFFEE BREAK -->
    <g transform="translate(615, 45)" text-anchor="middle">
      <!-- Coffee Cup Icon -->
      <g transform="translate(0, 10)">
        <path d="M-18,12 L-14,35 C-14,40 14,40 14,35 L18,12 Z" fill="none" stroke="#007F73" stroke-width="3" />
        <path d="M16,16 C25,16 25,28 15,28" fill="none" stroke="#007F73" stroke-width="2.5" />
        <path d="M-22,42 L22,42" stroke="#007F73" stroke-width="3" stroke-linecap="round" />
        <!-- Steam -->
        <path d="M-8,5 Q-11,0 -8,-5" fill="none" stroke="#007F73" stroke-width="2" stroke-linecap="round" />
        <path d="M0,7 Q-3,2 0,-3" fill="none" stroke="#007F73" stroke-width="2" stroke-linecap="round" />
        <path d="M8,5 Q5,0 8,-5" fill="none" stroke="#007F73" stroke-width="2" stroke-linecap="round" />
      </g>
      <text x="0" y="82" font-size="12" font-weight="700" fill="#627D98" letter-spacing="1">APÓS O TREINAMENTO</text>
      <text x="0" y="116" font-size="21" font-weight="900" fill="#004D40">COFFEE BREAK</text>
      <text x="0" y="146" font-size="10" font-weight="700" fill="#627D98" letter-spacing="0.5">PARA TODOS OS PARTICIPANTES</text>
    </g>
  </g>

  <!-- TWO BIG CALL-TO-ACTION BUTTONS (HOTSPOT AREAS) -->
  <!-- Left Button: CLIQUE AQUI PARA CONFIRMAR PRESENÇA -->
  <g id="btn-confirm-rsvp" transform="translate(50, 1035)">
    <rect x="0" y="0" width="355" height="120" rx="20" fill="#006B66" />

    <!-- Checkmark Badge -->
    <g transform="translate(45, 60)">
      <circle cx="0" cy="0" r="24" fill="#FFFFFF" />
      <path d="M-8,-1 L-2,6 L10,-6" fill="none" stroke="#006B66" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Text -->
    <text x="85" y="47" font-size="13" font-weight="700" fill="#E0F2F1" letter-spacing="1">CLIQUE AQUI PARA</text>
    <text x="85" y="77" font-size="19" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">CONFIRMAR</text>
    <text x="85" y="100" font-size="19" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">PRESENÇA</text>

    <!-- Clicking Hand Pointer Icon on Right -->
    <g transform="translate(305, 60)">
      <!-- Hand -->
      <path d="M-8,-16 L-8,2 L-14,6 L-12,18 L6,18 C12,18 14,12 14,6 L14,-4 C14,-7 11,-7 11,-4 L11,0 L8,0 L8,-10 C8,-13 5,-13 5,-10 L5,0 L2,0 L2,-13 C2,-16 -1,-16 -1,-13 L-1,0 L-4,0 L-4,-16 C-4,-19 -8,-19 -8,-16 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Click Rays / Sparkles -->
      <path d="M-15,-20 L-20,-24 M-8,-26 L-8,-32 M0,-22 L4,-26" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Right Button: CLIQUE AQUI PARA COMO CHEGAR -->
  <g id="btn-how-to-arrive" transform="translate(435, 1035)">
    <rect x="0" y="0" width="355" height="120" rx="20" fill="#FFFFFF" stroke="#006B66" stroke-width="3" />

    <!-- Map Pin Badge -->
    <g transform="translate(45, 60)">
      <circle cx="0" cy="0" r="24" fill="#006B66" />
      <circle cx="0" cy="-4" r="5" fill="#006B66" />
      <path d="M-7,-4 C-7,-10 7,-10 7,-4 C7,2 0,11 0,11 C0,11 -7,2 -7,-4 Z" fill="#FFFFFF" />
      <circle cx="0" cy="-4" r="3.5" fill="#006B66" />
    </g>

    <!-- Text -->
    <text x="85" y="47" font-size="13" font-weight="700" fill="#627D98" letter-spacing="1">CLIQUE AQUI PARA</text>
    <text x="85" y="77" font-size="20" font-weight="900" fill="#006B66" letter-spacing="0.5">COMO</text>
    <text x="85" y="100" font-size="20" font-weight="900" fill="#006B66" letter-spacing="0.5">CHEGAR</text>

    <!-- Clicking Hand Pointer Icon on Right -->
    <g transform="translate(305, 60)">
      <!-- Hand -->
      <path d="M-8,-16 L-8,2 L-14,6 L-12,18 L6,18 C12,18 14,12 14,6 L14,-4 C14,-7 11,-7 11,-4 L11,0 L8,0 L8,-10 C8,-13 5,-13 5,-10 L5,0 L2,0 L2,-13 C2,-16 -1,-16 -1,-13 L-1,0 L-4,0 L-4,-16 C-4,-19 -8,-19 -8,-16 Z" fill="none" stroke="#006B66" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Click Rays / Sparkles -->
      <path d="M-15,-20 L-20,-24 M-8,-26 L-8,-32 M0,-22 L4,-26" stroke="#006B66" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- VALUE PROPOSITION & TARGET SECTION -->
  <g transform="translate(50, 1195)">
    <!-- Left Box: JUNTOS FAZEMOS A DIFERENÇA -->
    <g transform="translate(0, 0)">
      <!-- Card background -->
      <rect x="0" y="0" width="345" height="280" rx="20" fill="#F0F8F7" stroke="#D1EAE7" stroke-width="1.5" />

      <!-- Outline Illustration of Síndico & Zelador -->
      <g transform="translate(70, 30)">
        <!-- Sindico -->
        <circle cx="35" cy="25" r="15" fill="none" stroke="#007F73" stroke-width="3" />
        <path d="M12 75 C12 52 58 52 58 75" fill="none" stroke="#007F73" stroke-width="3" />
        <path d="M35 55 L38 68 L35 72 L32 68 Z" fill="#007F73" />
        <!-- Zelador with cap -->
        <circle cx="95" cy="28" r="14" fill="none" stroke="#007F73" stroke-width="3" />
        <path d="M78 22 Q95 14 112 22 L116 26 L74 26 Z" fill="#007F73" />
        <path d="M72 75 C72 58 118 58 118 75" fill="none" stroke="#007F73" stroke-width="3" />
        <line x1="95" y1="56" x2="95" y2="75" stroke="#007F73" stroke-width="2.5" />
      </g>

      <text x="172" y="150" font-size="18" font-weight="900" fill="#004D40" text-anchor="middle">JUNTOS, FAZEMOS</text>
      <text x="172" y="174" font-size="18" font-weight="900" fill="#004D40" text-anchor="middle">A DIFERENÇA!</text>

      <text x="172" y="215" font-size="13.5" font-weight="500" fill="#334E68" text-anchor="middle">
        <tspan x="172" dy="0">A participação de síndicos</tspan>
        <tspan x="172" dy="20">e zeladores fortalece o</tspan>
        <tspan x="172" dy="20">condomínio e transforma</tspan>
        <tspan x="172" dy="20">a rotina de todos.</tspan>
      </text>
    </g>

    <!-- Vertical Divider -->
    <line x1="370" y1="20" x2="370" y2="260" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Right Box: SÍNDICOS e ZELADORES Breakdown -->
    <g transform="translate(390, 10)">
      <!-- Item 1: SÍNDICOS -->
      <g transform="translate(0, 15)">
        <!-- Star in Circle Icon -->
        <circle cx="28" cy="28" r="25" fill="#006B66" />
        <polygon points="28,14 32,23 42,23 34,29 37,39 28,33 19,39 22,29 14,23 24,23" fill="#FFFFFF" />

        <text x="68" y="22" font-size="18" font-weight="900" fill="#004D40" letter-spacing="1">SÍNDICOS</text>
        <text x="68" y="46" font-size="13.5" font-weight="500" fill="#334E68">
          <tspan x="68" dy="0">Invista no desenvolvimento</tspan>
          <tspan x="68" dy="20">da sua equipe e eleve o nível</tspan>
          <tspan x="68" dy="20">de gestão do seu condomínio.</tspan>
        </text>
      </g>

      <!-- Item 2: ZELADORES -->
      <g transform="translate(0, 145)">
        <!-- Shield in Circle Icon -->
        <circle cx="28" cy="28" r="25" fill="#006B66" />
        <path d="M28,15 L40,19 L40,29 C40,36 34,41 28,43 C22,41 16,36 16,29 L16,19 Z" fill="#FFFFFF" />
        <path d="M24,29 L27,32 L33,25" fill="none" stroke="#006B66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

        <text x="68" y="22" font-size="18" font-weight="900" fill="#004D40" letter-spacing="1">ZELADORES</text>
        <text x="68" y="46" font-size="13.5" font-weight="500" fill="#334E68">
          <tspan x="68" dy="0">Aprenda novas soluções,</tspan>
          <tspan x="68" dy="20">aprimore suas habilidades e</tspan>
          <tspan x="68" dy="20">faça ainda mais a diferença</tspan>
          <tspan x="68" dy="20">no dia a dia.</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- FOOTER -->
  <g transform="translate(420, 1680)" text-anchor="middle">
    <line x1="-280" y1="-30" x2="-140" y2="-30" stroke="#004D40" stroke-width="1.5" />
    <text x="0" y="-24" font-size="16" font-weight="700" fill="#0A2540" letter-spacing="3">JUNTOS, CONECTANDO</text>
    <line x1="140" y1="-30" x2="280" y2="-30" stroke="#004D40" stroke-width="1.5" />

    <text x="0" y="8" font-size="21" font-weight="800" fill="#0A2540" letter-spacing="2">SOLUÇÕES E PESSOAS</text>
    <text x="0" y="44" font-size="24" font-weight="900" fill="#00897B" letter-spacing="2">PARA UM FUTURO MELHOR.</text>
  </g>

  <!-- Bottom geometric accents -->
  <polygon points="0,1880 180,1880 0,1700" fill="#003D38" />
  <polygon points="0,1880 120,1880 0,1760" fill="#005952" />
  <polygon points="0,1880 60,1880 0,1820" fill="#008075" />

  <polygon points="660,1880 840,1880 840,1700" fill="#003D38" />
  <polygon points="720,1880 840,1880 840,1760" fill="#005952" />
  <polygon points="780,1880 840,1880 840,1820" fill="#008075" />
</svg>