<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      (function() {
        try {
          var nativeFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(val) {
              activeFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if property cannot be redefined
        }
      })();
    </script>
